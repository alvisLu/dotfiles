#set -g default-shell /bin/zsh

# Mouse behavior
set -g mouse on

set -g focus-events on

# Eliminate ESC key delay
set -s escape-time 0

# Use Ctrl-A as prefix key
set -g prefix C-a
unbind-key C-b
bind C-a send-prefix

# Use "-" and "\" splits the screen and fix current_path on new pane and window
bind \\ split-window -h -c '#{pane_current_path}'
bind -  split-window -v -c '#{pane_current_path}'

# Use "hjkl" pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane
## Use "HJKL" resize pane
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Enable vi mode in tmux
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# prefix + g: 撈出畫面上的 path:line 參照(如 Claude 印的),fzf 選一個用 VSCode 開到那行
bind-key g display-popup -E -w 80% -h 60% -d '#{pane_current_path}' '~/.tmux/open-fileref.sh'

# prefix + C-o: detach tmux 並在同一個終端機切到 herdr (由 ~/.local/bin/mux 接手)
bind C-o run-shell 'mkdir -p ~/.cache && echo herdr > ~/.cache/mux-next' \; detach-client
# prefix + R: rerun .tmux.config
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
# prefix + m: switch to last session
bind -N "last-session (via sesh) " m run-shell "sesh last"


# sesh setting
bind-key "T" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-s:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

#-- Plugin ---------------------------------------------------------------------
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'hiroppy/tmux-agent-sidebar'

# tmux-agent-sidebar 桌面通知
# 不設 = 除了 task_completed 以外全開; all = 連 sub-agent 完成也通知
set -g @sidebar_notifications_events all
# 其他選項(擇一, 後蓋前):
# set -g @sidebar_notifications_events "stop,notification"                 # 不要 error 類通知
# set -g @sidebar_notifications_events "stop,notification,task_completed"  # 只留這三種, 含 sub-agent

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'
# OSC 52 off: copy 已由 pbcopy 綁定處理; 開著會在不支援 OSC 52 的外層終端機
# (如 VS Code/整合終端機) 把 `52;c;<base64>` 當文字印出來
set -s set-clipboard off
# set -g @yank_action 'copy-pipe'
# Initialize TMUX plugin manager(keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


#-- Color ----------------------------------------------------------------------
# Enable True Color support
# Change it to ",xterm-256color:Tc" if using OSX and iTerm2
#set-option -ga terminal-overrides ",screen-256color:Tc"
#set-option -ga terminal-overrides ',xterm-256color:Tc'
set -g terminal-overrides ',xterm-256color:Tc'
set -g default-terminal "screen-256color"
set -as terminal-overrides ',xterm*:sitm=\E[3m'

# Pane border
set-option -g pane-border-style fg=colour248
set-option -g pane-active-border-style fg=colour154 #base01

# Message bar
set-option -g message-style bg=colour236,fg=default #orange

# Status bar design
set -g status-position top
set -g status-style bg=colour236,fg=colour255,dim
set -g status-left ''
set -g status-left-length 20
set -g status-right '#[fg=colour14,bold] #S '
set -g status-right-length 50

# Active window title
setw -g window-status-current-style fg=colour16,bg=colour248,bold
setw -g window-status-current-format ' #I:#W '

# Default window title
setw -g window-status-style fg=colour15,bg=colour237,none
setw -g window-status-format ' #I:#W '

# Bell window
setw -g window-status-bell-style fg=colour255,bg=colour6,bold
